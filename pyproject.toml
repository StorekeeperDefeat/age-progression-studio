[project]
name = "age-progression-studio"
version = "0.6.3"
description = "AI age progression generator — desktop toolkit for face aging synthesis."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "age-progression-studio contributors" }]
readme = "CONTRIBUTING.md"

[project.scripts]
aps = "age_progression_studio.__main__:main"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"